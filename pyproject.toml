[project]
name = "ds207-final-project"
version = "0.1.0"
description = "Machine Learning Final Project (DATASCI207)"
requires-python = ">=3.12,<3.13"
dependencies = [
    #
    "matplotlib>=3.8,<3.11",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
    "scikit-learn>=1.8.0",
    "optuna>=4.9.0",
    # Mac Intel: TensorFlow 2.16.2 needs NumPy <2.
    # "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tensorflow==2.16.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "openvino>=2025.4.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everyone else: allow newer versions.
    "numpy>=2.4.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tensorflow>=2.17,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.3,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "openvino>=2026.2.1; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    #
    "statsmodels>=0.14.6",
    "ipykernel>=7.2.0",
    "pydot==4.0.1",
    "graphviz==0.21",
    "keras>=3.14.0",
    "scikit-anfis",
    "python-dotenv>=1.2.2",
    "transformers>=5.12.1",
    "sentence-transformers>=5.6.0",
    "mlxtend>=0.23.4",
    "plotly>=6.8.0",
    "nbformat>=5.10.4",
    "xgboost>=3.0,<3.1",
    "lightgbm>=4.6.0",
    "catboost>=1.2.10",
    "optuna-integration>=4.9.0",
    "cupy-cuda12x>=14.1.1 ; sys_platform == 'win32'",
    "tqdm>=4.67.3",
    "onnxmltools>=1.16.0",
    "icd9cms>=0.2.1",
    "shap>=0.49.1",
    "embedding-atlas>=0.22.0",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]

[tool.uv.sources]
scikit-anfis = { git = "https://github.com/hudscomdz/scikit-anfis.git", branch = "main" }
torch = { index = "pytorch-cu128", marker = "sys_platform == 'win32' and platform_machine == 'AMD64'" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "ruff>=0.15.15",
]
