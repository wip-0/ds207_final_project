[project]
name = "ds207-final-project"
version = "0.1.0"
description = "Machine Learning Final Project (DATASCI207)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10.9",
    "pandas>=3.0.3",
    "seaborn>=0.13.2",
    "scikit-learn>=1.8.0",
    "optuna>=4.9.0",
    # Mac Intel: TensorFlow 2.16.2 needs NumPy <2.
    "numpy>=1.26,<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "tensorflow==2.16.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch==2.2.0; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Everyone else: allow newer versions.
    "numpy>=2.4.6; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "tensorflow>=2.17,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torch>=2.3,<3; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "statsmodels>=0.14.6",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
